<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CONCEPT BRAND | Shop</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <a href="index.html" class="logo">
            <img src="images/Logo.jpg"
                 alt="CONCEPT BRAND Logo" width="300" height="200">
        </a>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="about.html">About Us</a>
            </li>

            <li>
                <a href="shop.html">Shop</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

        </ul>

    </nav>

</header>


<section class="featured">

    <h1>CONCEPT BRAND SHOP</h1>

    <p>Explore our latest collection.</p>


    <div class="product-container">

        <div class="product-card">

            <img src="images/Shirt 1.jpg"
                 alt="Concept Classic T-Shirt">

            <h3>Classic T-Shirt</h3>

            <p>R350</p>

            <button onclick="addToCart('Classic T-Shirt')">
                Add to Cart
            </button>

        </div>


        <div class="product-card">

            <img src="images/Shirt 2.jpg"
                 alt="Concept Premium T-Shirt">

            <h3>Premium T-Shirt</h3>

            <p>R350</p>

            <button onclick="addToCart('Premium T-Shirt')">
                Add to Cart
            </button>

        </div>


        <div class="product-card">

            <img src="images/Shirt 3.jpg"
                 alt="Concept T-Shirt">

            <h3>Signature T-Shirt</h3>

            <p>R300</p>

            <button onclick="addToCart('Signature Hoodie')">
                Add to Cart
            </button>

        </div>


        <div class="product-card">

            <img src="images/Tracksuit.jpg"
                 alt="Concept Street Pants">

            <h3>Street Pants</h3>

            <p>R550</p>

            <button onclick="addToCart('Street Pants')">
                Add to Cart
            </button>

        </div>

    </div>

</section>


<footer>

    <h3>CONCEPT BRAND</h3>

    <p>Fashion. Identity. Creativity.</p>

</footer>


<script src="script.js"></script>
